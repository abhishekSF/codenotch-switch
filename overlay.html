<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Codenotch Switch</title>
  <meta name="description" content="A replica of Codenotch with switches for Gemini, ChatGPT, and Grok.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2300FF88' stroke-width='2.4' stroke-dasharray='30 20' stroke-linecap='round' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
</head>
<body>
  <div class="notch-world" id="notch-world" data-edge="right">
    <div id="notch-layer" class="notch-layer"></div>
  </div>

  <div class="hud" aria-label="Switch model">
    <div class="model-switch" id="model-switch" role="tablist" aria-label="Gemini, ChatGPT, Grok">
      <div class="model-switch-thumb" id="switch-thumb"></div>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title">Settings</h2>
        <button type="button" class="sheet-close" id="sheet-close">Done</button>
      </header>

      <div class="sheet-body">
        <h3 class="section-label">Integrations</h3>
        <section class="group">
          <p class="group-note">One switch per model. Off hides the ring and forgets the demo reading. On brings it back.</p>
          <div id="account-rows"></div>
        </section>

        <h3 class="section-label">Appearance</h3>
        <section class="group">
          <label class="row">
            <span>Edge</span>
            <div class="seg" id="edge-seg"></div>
          </label>
          <p class="caption" id="edge-caption"></p>
        </section>

        <p class="credit">
          Replica of
          <a href="https://github.com/vinzdg/codenotch" target="_blank" rel="noreferrer">Codenotch</a>
          by
          <a href="https://x.com/hivinz_" target="_blank" rel="noreferrer">@hivinz_</a>
        </p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
